<!DOCTYPE html><html><head><meta charset="UTF-8"><title>LEO THE PHILOSOPHER</title><style>
  :root { --t: 0.4s ease; }
  body, html { margin:0; padding:0; width:100%; height:100%; background:#000; font-family:sans-serif; color:#fff; overflow:hidden; }
  .site { display:flex; flex-direction:column; width:100vw; height:100vh; }
  .nav { display:flex; align-items:center; height:70px; border-bottom:1px solid #333; padding:0 30px; transition:var(--t); }
  .osdg { border:1px solid #fff; padding:6px 20px; font-weight:bold; letter-spacing:2px; margin-right:20px; }
  .dot { width:12px; height:12px; background:#ff3b30; margin-right:40px; }
  .links { display:flex; gap:30px; font-size:12px; letter-spacing:2px; }
  .links a { color:#888; text-decoration:none; } .links a.active { color:#fff; }
  .work { display:flex; flex:1; height:calc(100vh - 120px); }
  .side { width:260px; padding:30px; display:flex; flex-direction:column; transition:var(--t); }
  .side h1 { font-size:36px; margin:0; } .side div { width:30px; height:30px; background:#ff3b30; margin:10px 0; }
  .side p { font-size:12px; color:#888; margin:0 0 30px 0; }
  .view { flex:1; display:flex; align-items:center; justify-content:center; }
  .frame { position:relative; width:80%; max-width:1000px; aspect-ratio:4/3; background:#111; border:1px solid #333; transform:translateX(0.75in); transition:var(--t); overflow:hidden; cursor:pointer; }
  .engine { display:flex; width:100%; height:100%; overflow:hidden; }
  .spread { flex:0 0 100%; width:100%; height:100%; display:flex; background:#000; }
  .page { flex:0 0 50%; width:50%; height:100%; background:#fff; border-right:1px solid #ddd; }
  iframe { width:100%; height:100%; border:none; pointer-events:none; }
  .arrows { position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); display:flex; justify-content:between; padding:0 15px; pointer-events:none; }
  .btn { width:40px; height:40px; border-radius:50%; border:1px solid #555; background:#000; color:#fff; font-size:20px; cursor:pointer; pointer-events:auto; }
  .btn:disabled { opacity:0.2; cursor:not-allowed; }
  .foot { display:flex; justify-content:space-between; height:50px; border-top:1px solid #222; padding:0 30px; align-items:center; font-size:10px; color:#555; transition:var(--t); }
  .focus .nav { opacity:0; transform:translateY(-70px); pointer-events:none; }
  .focus .side { opacity:0; transform:translateX(-100px); pointer-events:none; }
  .focus .foot { opacity:0; transform:translateY(50px); pointer-events:none; }
  .focus .frame { width:100vw; max-width:100%; height:100vh; border:none; transform:translateX(0.75in); }
  .focus .arrows { opacity:0; pointer-events:none; }
</style></head>
<body id="w"><div class="site">
  <div class="nav"><div class="osdg">OSDG</div><div class="dot"></div><div class="links"><a href="#" class="active">PROJECTS</a><a href="#">ABOUT</a><a href="#">TEAM</a></div></div>
  <div class="work">
    <div class="side"><h2>PROJECTS</h2><h1>LEO</h1><div></div><p>THE PHILOSOPHER<br><i>This Great Feast of Life</i></p><b>WOBBLY BOOK®</b><br><a href="#" style="color:#fff;text-decoration:underline;">SERIES SYNOPSIS</a></div>
    <div class="view"><div class="frame" id="f">
      <div class="engine" id="e">
        <div class="spread"><div class="page"><iframe src="synopsis.pdf#page=1&toolbar=0&navpanes=0&view=Fit"></iframe></div><div class="page"><iframe src="synopsis.pdf#page=2&toolbar=0&navpanes=0&view=Fit"></iframe></div></div>
        <div class="spread"><div class="page"><iframe src="synopsis.pdf#page=3&toolbar=0&navpanes=0&view=Fit"></iframe></div><div class="page"><iframe src="synopsis.pdf#page=4&toolbar=0&navpanes=0&view=Fit"></iframe></div></div>
      </div>
      <div class="arrows" style="justify-content:space-between;"><button class="btn" id="l" disabled>‹</button><button class="btn" id="r">›</button></div>
    </div></div>
  </div>
  <div class="foot"><div>© OSDG 2026</div><div>Site by OSDG</div></div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const w=document.getElementById('w'), f=document.getElementById('f'), e=document.getElementById('e'), l=document.getElementById('l'), r=document.getElementById('r');
    let idx = 0;
    function move() { e.scrollTo({ left: idx * e.clientWidth, behavior: 'smooth' }); l.disabled = idx === 0; r.disabled = idx === 1; }
    r.addEventListener('click', (ev) => { ev.stopPropagation(); if(idx<1) { idx++; move(); } });
    l.addEventListener('click', (ev) => { ev.stopPropagation(); if(idx>0) { idx--; move(); } });
    window.addEventListener('resize', () => e.scrollTo({ left: idx * e.clientWidth, behavior: 'auto' }));
    f.addEventListener('dblclick', () => { w.classList.toggle('focus'); setTimeout(move, 450); });
    document.addEventListener('keydown', (ev) => { if(ev.key==='Escape' && w.classList.contains('focus')) { w.classList.remove('focus'); setTimeout(move, 450); } });
  });
</script></body></html>
