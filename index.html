<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEO THE PHILOSOPHER | This Great Feast of Life</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }
    .site-viewport-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      position: relative;
    }
    .top-navigation-navbar {
      display: flex;
      align-items: center;
      width: 100%;
      height: 70px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      box-sizing: border-box;
      padding: 0 40px;
    }
    .osdg-identity-logo {
      border: 1px solid #ffffff;
      padding: 8px 24px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.3em;
      margin-right: 40px;
      text-transform: uppercase;
    }
    .brand-accent-indicator {
      width: 12px;
      height: 12px;
      background-color: #ff3b30;
      margin-right: 60px;
    }
    .navbar-navigation-links {
      display: flex;
      gap: 50px;
    }
    .navbar-navigation-links a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    .navbar-navigation-links a.active-route-item {
      color: #ffffff;
    }
    .workspace-columns-split {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100vh - 120px);
      box-sizing: border-box;
    }
    .left-sidebar-navigation-panel {
      width: 280px;
      height: 100%;
      padding: 40px 40px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .sidebar-context-heading {
      font-size: 11px;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    .sidebar-primary-title {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 0;
      line-height: 1.1;
    }
    .sidebar-decorative-square {
      width: 32px;
      height: 32px;
      background-color: #ff3b30;
      margin: 15px 0 20px 0;
    }
    .sidebar-identity-subtitle {
      font-size: 12px;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.7);
      margin: 0 0 5px 0;
      text-transform: uppercase;
    }
    .sidebar-tagline-text {
      font-size: 10px;
      font-style: italic;
      color: rgba(255, 255, 255, 0.4);
      margin: 0 0 50px 0;
    }
    .sidebar-wobbly-branding {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      margin-bottom: 30px;
      color: #ffffff;
    }
    .sidebar-synopsis-trigger-anchor {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #ffffff;
      padding-bottom: 4px;
      align-self: flex-start;
      text-transform: uppercase;
      font-weight: 500;
    }
    .center-canvas-display-viewport {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      position: relative;
    }
    
    /* Razor-Sharp PDF Embed Viewport Container */
    .pdf-viewer-layer {
      position: absolute;
      top: 15%;
      left: 22%;
      width: 68%;
      height: 62vh;
      border: none;
      z-index: 5;
      background-color: #000000;
    }
    
    .pdf-document-scroll-track {
      display: block;
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }
    .pdf-render-frame-node {
      width: 100%;
      height: 100%;
      display: block;
      border: none;
    }
    .site-footer-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 50px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 40px;
      box-sizing: border-box;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.4);
    }
    .site-footer-panel a {
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
    }
  </style>
</head>
<body class="site-viewport-wrapper">

  <header class="top-navigation-navbar">
    OSDG</div>
    <div class="brand-accent-indicator"></div>
    <nav class="navbar-navigation-links">
      <a href="#projects" class="active-route-item">PROJECTS</a>
      <a href="#about">ABOUT</a>
      <a href="#team">TEAM</a>
      <a href="#careers">CAREERS</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <main class="workspace-columns-split">
    <aside class="left-sidebar-navigation-panel">
      <div class="sidebar-context-heading">PROJECTS</div>
      <h1 class="sidebar-primary-title">LEO</h1>
      <div class="sidebar-decorative-square"></div>
      THE PHILOSOPHER</div>
      <div class="sidebar-tagline-text">This Great Feast of Life</div>
      
      <div class="sidebar-wobbly-branding">WOBBLY BOOK®</div>
      <a href="#" class="sidebar-synopsis-link-item" id="synopsisLinkMenu">SERIES SYNOPSIS</a>
    </aside>

    <div class="center-canvas-display-viewport">
      <div class="pdf-viewer-layer">
        <div class="pdf-document-scroll-track">
          <iframe src="synopsis.pdf#toolbar=0&navpanes=0&view=Fit" class="pdf-render-frame-node"></iframe>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer-panel">
    <div>© OSDG 2026</div>
    <div><a href="#">Privacy Policy, Terms & Conditions</a></div>
    <div>Site by OSDG</div>
  </footer>

</body>
</html>
