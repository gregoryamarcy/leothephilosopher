<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEO THE PHILOSOPHER | Projects</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #000000; overflow: hidden;
    }
    #bg-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('projects.png');
      background-size: 100% 100%; background-repeat: no-repeat; z-index: 1;
    }
    /* Invisible, perfectly placed button hot-spots over your image text links */
    .hotspot-nav {
      position: absolute; top: 0; left: 0; width: 100%; height: 70px; z-index: 10; display: flex;
    }
    .space-left-gate { width: 440px; height: 100%; }
    .click-target-link { height: 100%; cursor: pointer; display: block; }
    .link-about { width: 130px; }
    .link-team { width: 110px; }
    .link-careers { width: 140px; }
    .link-contact { width: 140px; }
    
    #synopsis-hotspot {
      position: absolute; top: 380px; left: 15px; width: 150px; height: 35px; z-index: 10; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="bg-layer"></div>
  
  <div class="hotspot-nav">
    <div class="space-left-gate"></div>
    <a href="about.html" class="click-target-link link-about"></a>
    <a href="team.html" class="click-target-link link-team"></a>
    <a href="careers.html" class="click-target-link link-careers"></a>
    <a href="contact.html" class="click-target-link link-contact"></a>
  </div>

  <a href="synopsis.html"><div id="synopsis-hotspot"></div></a>
</body>
</html>
