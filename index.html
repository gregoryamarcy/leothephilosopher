<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEO THE PHILOSOPHER | This Great Feast of Life</title>
  <style>
    /* ==========================================================================
       RESTORED GLOBAL SITE FRAMEWORK & RESPONSIVE TRACKING LAYOUT
       ========================================================================== */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden; /* Prevent native window scroll up/down */
    }

    .site-container {
      position: relative;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.5s ease-in-out;
    }

    /* ==========================================================================
       RESTORED NAVIGATION LAYOUTS & IMAGE TRACK OVERLAYS
       ========================================================================== */
    .nav-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
    }

    /* ==========================================================================
       SERIES SYNOPSIS COMPONENT CONTAINER LAYOUT (UPDATED)
       ========================================================================== */
    .pdf-viewer-layer {
      display: none; /* Controlled dynamically by your navigation engine */
      box-sizing: border-box;
      position: absolute;
      
      /* Vertical framing matching your layout proportions */
      top: 7.5vh;
      height: 84vh; 
      max-height: 84vh; 
      
      /* Horizontal framing matching your ideal proportions */
      left: 18vw;
      width: 72vw;
      border: none;
      
      /* Exact Visual Balance Shifting 3/4" to the Right */
      transform: translateX(0.75in); 
      
      /* Smooth Transition State for Immersive Full-Screen Toggle */
      transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease, top 0.3s ease, left 0.3s ease;
      z-index: 10;
    }

    /* ==========================================================================
       IMMERSIVE FULL-SCREEN / FOCUS MODE OVERRIDE
       ========================================================================== */
    .pdf-viewer-layer:fullscreen,
    .pdf-viewer-layer.focus-mode-active {
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      top: 0 !important;
      left: 0 !important;
      transform: translateX(0) !important;
      background-color: #000000 !important;
      z-index: 999999 !important;
    }
  </style>
</head>
<body>

  <div class="site-container" id="slideViewer">
    <!-- Main Top Navigation Hotspots mapped over tracking slides -->
    <div class="nav-overlay" id="mainNavOverlay">
      <!-- Mapped pixel coordinates are processed directly by your script below -->
      <div style="position: absolute; left: 32%; top: 0%; width: 11%; height: 8%; cursor: pointer;" onclick="jumpToTrack('projects')"></div>
      <div style="position: absolute; left: 45%; top: 0%; width: 9%; height: 8%; cursor: pointer;" onclick="jumpToTrack('about')"></div>
      <div style="position: absolute; left: 56%; top: 0%; width: 8%; height: 8%; cursor: pointer;" onclick="jumpToTrack('greg')"></div>
      <div style="position: absolute; left: 66%; top: 0%; width: 11%; height: 8%; cursor: pointer;" onclick="jumpToTrack('careers')"></div>
      <div style="position: absolute; left: 80%; top: 0%; width: 11%; height: 8%; cursor: pointer;" onclick="jumpToTrack('contact')"></div>
      <div style="position: absolute; left: 2%; top: 0%; width: 15%; height: 8%; cursor: pointer;" onclick="jumpToTrack('index')"></div>
    </div>

    <!-- Dynamic Left Panel Project Hotspots -->
    <div class="nav-overlay" id="projectsNavOverlay" style="display: none;">
      <div style="position: absolute; left: 2%; top: 28%; width: 15%; height: 5%; cursor: pointer;" onclick="jumpToTrack('wobblybook')"></div>
      <div style="position: absolute; left: 2%; top: 35%; width: 15%; height: 5%; cursor: pointer;" onclick="jumpToTrack('synopsis')"></div>
    </div>

    <!-- Interactive PDF Embed Viewport (Appears for Synopsis Track) -->
    <iframe class="pdf-viewer-layer" id="pdfViewer" src="about:blank"></iframe>
  </div>

  <script>
    const bookTracks = {
      'index': { type: 'image', source: 'index.png' },
      'projects': { type: 'image', source: 'projects.png' },
      'about': { type: 'image', source: 'about.png' },
      'greg': { type: 'image', source: 'greg.png' },
      'careers': { type: 'image', source: 'careers.png' },
      'contact': { type: 'image', source: 'contact.png' },
      'wobblybook': { type: 'image', source: 'wobblybook.png' },
      'synopsis': {
        type: 'document',
        source: 'synopsis.pdf#toolbar=0&navpanes=0&view=Fit'
      }
    };

    let currentTrack = 'index';

    function jumpToTrack(trackName) {
      if (!bookTracks[trackName]) return;
      currentTrack = trackName;
      renderCurrentState();
    }

    function renderCurrentState() {
      const activeTrack = bookTracks[currentTrack];
      const slideViewer = document.getElementById('slideViewer');
      const pdfWindow = document.getElementById('pdfViewer');
      const projectsOverlay = document.getElementById('projectsNavOverlay');

      // Handle Left Sub-Menu Hotspots Visibility
      if (currentTrack === 'projects' || currentTrack === 'wobblybook' || currentTrack === 'synopsis') {
        projectsOverlay.style.display = 'block';
      } else {
        projectsOverlay.style.display = 'none';
      }

      // Route Content Rendering
      if (activeTrack.type === 'document') {
        slideViewer.style.backgroundImage = "url('projects.png')";
        pdfWindow.src = activeTrack.source;
        pdfWindow.style.display = 'block';
      } else {
        pdfWindow.style.display = 'none';
        pdfWindow.src = 'about:blank';
        slideViewer.style.backgroundImage = "url('" + activeTrack.source + "')";
      }
    }

    // Initialize the landing page view state on launch
    renderCurrentState();
  </script>
</body>
</html>
