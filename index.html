<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEO THE PHILOSOPHER | This Great Feast of Life</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }
    .site-viewport-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      position: relative;
      background-color: #000000;
    }
    .top-navigation-navbar {
      display: flex;
      align-items: center;
      width: 100%;
      height: 70px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      box-sizing: border-box;
      padding: 0 40px;
      z-index: 10;
      position: relative;
    }
    .osdg-identity-logo {
      border: 1px solid #ffffff;
      padding: 8px 24px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.3em;
      margin-right: 40px;
      text-transform: uppercase;
    }
    .brand-accent-indicator {
      width: 12px;
      height: 12px;
      background-color: #ff3b30;
      margin-right: 60px;
    }
    .navbar-navigation-links {
      display: flex;
      gap: 50px;
    }
    .navbar-navigation-links a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .navbar-navigation-links a.active-route-item {
      color: #ffffff;
    }
    .workspace-columns-split {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100vh - 70px);
      box-sizing: border-box;
      position: relative;
    }
    .left-sidebar-navigation-panel {
      width: 280px;
      height: 100%;
      padding: 40px 40px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      z-index: 10;
      position: relative;
    }
    .sidebar-context-heading {
      font-size: 11px;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    .sidebar-primary-title {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 0;
      line-height: 1.1;
    }
    .sidebar-decorative-square {
      width: 32px;
      height: 32px;
      background-color: #ff3b30;
      margin: 15px 0 20px 0;
    }
    .sidebar-identity-subtitle {
      font-size: 12px;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.7);
      margin: 0 0 5px 0;
      text-transform: uppercase;
    }
    .sidebar-tagline-text {
      font-size: 10px;
      font-style: italic;
      color: rgba(255, 255, 255, 0.4);
      margin: 0 0 50px 0;
    }
    .sidebar-wobbly-branding {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      margin-bottom: 30px;
      color: #ffffff;
    }
    .sidebar-synopsis-link-item {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #ffffff;
      padding-bottom: 4px;
      align-self: flex-start;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
    }
    .center-canvas-display-viewport {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      position: relative;
    }
    
    /* --- STRUCTURAL PORTFOLIO BACKGROUND IMAGE CONTAINER --- */
    #slideViewer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 100% 100%;
      background-position: top left;
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* --- SOLID SHIELD MASK (Blocks background text bleed cleanly) --- */
    #canvas-backdrop-sandbox {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: 3;
      display: none;
      border: none;
    }
    
    /* --- PROPORTIONATE READING WINDOW FRAME CONTAINER --- */
    .pdf-viewer-layer {
      position: absolute;
      top: 10%;
      left: 20%;
      width: 76%;
      height: 75vh;
      border: none;
      z-index: 5;
      background-color: #000000;
      display: none;
      overflow: hidden;
    }
    .pdf-document-scroll-track {
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .pdf-render-frame-node {
      width: 100%;
      height: 100%;
      display: block;
      border: none;
      overflow: hidden;
    }
    .site-footer-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 50px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 40px;
      box-sizing: border-box;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.4);
      z-index: 10;
      position: relative;
      background-color: #000000;
    }
    .site-footer-panel a {
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
    }
  </style>
</head>
<body class="site-viewport-wrapper">

  <!-- Dynamic Runtime Slide Background Layer Node -->
  <div id="slideViewer"></div>

  <header class="top-navigation-navbar">
    OSDG</div>
    <div class="brand-accent-indicator"></div>
    <nav class="navbar-navigation-links" id="topNavLinks">
      <a data-target="projects" class="active-route-item" onclick="jumpToTrack('projects')">PROJECTS</a>
      <a data-target="about" onclick="jumpToTrack('about')">ABOUT</a>
      <a data-target="team" onclick="jumpToTrack('team')">TEAM</a>
      <a data-target="careers" onclick="jumpToTrack('careers')">CAREERS</a>
      <a data-target="contact" onclick="jumpToTrack('contact')">CONTACT</a>
    </nav>
  </header>

  <main class="workspace-columns-split">
    <aside class="left-sidebar-navigation-panel">
      <div class="sidebar-context-heading">PROJECTS</div>
      <h1 class="sidebar-primary-title">LEO</h1>
      <div class="sidebar-decorative-square"></div>
      THE PHILOSOPHER</div>
      <div class="sidebar-tagline-text">This Great Feast of Life</div>
      
      <div class="sidebar-wobbly-branding">WOBBLY BOOK®</div>
      <a class="sidebar-synopsis-link-item" id="synopsisLinkMenu" onclick="jumpToTrack('synopsis')">SERIES SYNOPSIS</a>
    </aside>

    <div class="center-canvas-display-viewport">
      <!-- Black backdrop mask layer -->
      <div id="canvas-backdrop-sandbox"></div>
      
      <!-- Reading canvas layout container viewport -->
      <div class="pdf-viewer-layer" id="pdfViewer">
        <div class="pdf-document-scroll-track">
          <iframe src="synopsis.pdf#toolbar=0&navpanes=0&view=FitH" class="pdf-render-frame-node" scrolling="no"></iframe>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer-panel">
    <div>© OSDG 2026</div>
    <div><a href="#">Privacy Policy, Terms & Conditions</a></div>
    <div>Site by OSDG</div>
  </footer>

  <script>
    // Asset Track Configuration Dictionary Registry
    const tracks = {
      'projects': { type: 'image', src: 'projects.png' },
      'about':    { type: 'image', src: 'about.png' },
      'team':     { type: 'image', src: 'team.png' },
      'careers':  { type: 'image', src: 'careers.png' },
      'contact':  { type: 'image', src: 'contact.png' },
      'synopsis': { type: 'document', src: 'synopsis.pdf' }
    };

    let currentTrackKey = 'projects';

    // State Controller Render Engine
    function renderCurrentState() {
      const activeTrack = tracks[currentTrackKey];
      const slideViewer = document.getElementById('slideViewer');
      const pdfWindow = document.getElementById('pdfViewer');
      const sandboxMask = document.getElementById('canvas-backdrop-sandbox');

      if (!slideViewer) return;

      if (activeTrack.type === 'document') {
        slideViewer.style.backgroundImage = "url('projects.png')";
        if (sandboxMask) sandboxMask.style.display = "block";
        if (pdfWindow) pdfWindow.style.display = "block";
      } else if (activeTrack.type === 'image') {
        slideViewer.style.backgroundImage = `url('${activeTrack.src}')`;
        if (sandboxMask) sandboxMask.style.display = "none";
        if (pdfWindow) pdfWindow.style.display = "none";
      }
    }

    // Interactive Router Click Target Trigger
    function jumpToTrack(trackKey) {
      if (tracks[trackKey]) {
        currentTrackKey = trackKey;
        renderCurrentState();
        
        // Handle horizontal top menu active highlighter updates dynamically
        const links = document.querySelectorAll('#topNavLinks a');
        links.forEach(link => {
          const targetData = link.getAttribute('data-target');
          if (targetData === trackKey) {
            link.classList.add('active-route-item');
          } else {
            link.classList.remove('active-route-item');
          }
        });
      }
    }

    // Initialize display framework state upon page mount completion
    document.addEventListener('DOMContentLoaded', () => {
      renderCurrentState();
    });
  </script>
</body>
</html>
