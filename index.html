<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEO THE PHILOSOPHER | This Great Feast of Life</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .site-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            margin: 0 auto;
            background-image: url('index.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.2s ease-in-out;
        }
        .nav-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8%;
            display: flex;
        }
        .nav-logo {
            width: 16%;
            height: 100%;
            cursor: pointer;
        }
        .nav-spacer {
            width: 13%;
            height: 100%;
        }
        .nav-links {
            width: 71%;
            height: 100%;
            display: flex;
        }
        .nav-item {
            flex: 1;
            height: 100%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0);
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="site-container" id="slideViewer">
        <nav class="nav-overlay">
            <div class="nav-logo" onclick="changeSlide('index.png')"></div>
            <div class="nav-spacer"></div>
            <div class="nav-links">
                <div class="nav-item" onclick="changeSlide('projects.png')"></div>
                <div class="nav-item" onclick="changeSlide('about.png')"></div>
                <div class="nav-item" onclick="changeSlide('greg.png')"></div>
                <div class="nav-item" onclick="changeSlide('careers.png')"></div>
                <div class="nav-item" onclick="changeSlide('contact.png')"></div>
            </div>
        </nav>
    </div>

    <script>
        function changeSlide(imageName) {
            document.getElementById('slideViewer').style.backgroundImage = "url('" + imageName + "')";
        }
    </script>
</body>
</html>
