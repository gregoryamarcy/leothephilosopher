<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEO THE PHILOSOPHER | This Great Feast of Life</title>
  <style>
    /* ==========================================================================
       PRIMARY CORE LAYOUT SYSTEM
       ========================================================================== */
    
    :root {
      --transition-timing: 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      --canvas-ratio: 4 / 3;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden; /* Disables all default vertical window scrolling entirely */
    }

    /* Outer Wrapper framework */
    .site-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      position: relative;
    }

    /* ==========================================================================
       TOP NAVIGATION NAVBAR
       ========================================================================== */
    
    .top-navbar {
      display: flex;
      align-items: center;
      width: 100%;
      height: 70px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      box-sizing: border-box;
      padding: 0 40px;
      transition: opacity var(--transition-timing), transform var(--transition-timing);
    }

    .osdg-box {
      border: 1px solid #ffffff;
      padding: 8px 24px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.3em;
      margin-right: 40px;
      text-transform: uppercase;
    }

    .orange-dot {
      width: 12px;
      height: 12px;
      background-color: #ff3b30; /* Tiny red/orange accent square from your header */
      margin-right: 60px;
    }

    .top-nav-links {
      display: flex;
      gap: 50px;
    }

    .top-nav-links a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .top-nav-links a:hover, .top-nav-links a.active {
      color: #ffffff;
    }

    /* ==========================================================================
       MAIN COLUMN LAYOUT SPLIT
       ========================================================================== */
    
    .main-workspace {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100vh - 120px); /* Leaves exact clearance allocation for header and footer */
      box-sizing: border-box;
    }

    /* Left Sidebar Configuration */
    .left-sidebar {
      width: 280px;
      height: 100%;
      padding: 40px 40px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      transition: opacity var(--transition-timing), transform var(--transition-timing);
    }

    .sidebar-section-title {
      font-size: 11px;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .sidebar-main-title {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 0;
      line-height: 1.1;
    }

    .sidebar-red-square {
      width: 32px;
      height: 32px;
      background-color: #ff3b30;
      margin: 15px 0 20px 0;
    }

    .sidebar-sub-title {
      font-size: 12px;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.7);
      margin: 0 0 5px 0;
      text-transform: uppercase;
    }

    .sidebar-tagline {
      font-size: 10px;
      font-style: italic;
      color: rgba(255, 255, 255, 0.4);
      margin: 0 0 50px 0;
    }

    .sidebar-wobbly {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      margin-bottom: 30px;
      color: #ffffff;
    }

    .sidebar-synopsis-link {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #ffffff;
      padding-bottom: 4px;
      align-self: flex-start;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ==========================================================================
       MIDDLE READING SURFACE CANVAS (.pdf-viewer-layer)
       ========================================================================== */
    
    .reading-canvas-container {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      position: relative;
    }

    /* 
      1. INITIAL PROPORTION ALIGNMENT 
      Shifts frame 3/4 inch (~72px) right to balance perfectly against left navigation panel
    */
    .pdf-viewer-layer {
      position: relative;
      width: 85%;
      max-width: 1150px;
      aspect-ratio: var(--canvas-ratio);
      background-color: #0c0c0c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
      transform: translateX(0.75in); 
      transition: transform var(--transition-timing),
                  width var(--transition-timing),
                  max-width var(--transition-timing),
                  height var(--transition-timing),
                  border-color var(--transition-timing);
      overflow: hidden;
      cursor: pointer;
    }

    /* ==========================================================================
       2. HORIZONTAL READING EXPERIENCE ENGINE
       ========================================================================== */
    
    .horizontal-reading-engine {
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: row;
      overflow-y: hidden; /* Vertical scrolling is locked out completely inside this size layout */
      overflow-x: hidden; 
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }

    /* Each slide holds 2 portrait pages side-by-side to make a horizontal spread */
    .book-spread-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      flex-direction: row;
      background: #000000;
      box-sizing: border-box;
    }

    .page-portrait-frame {
      flex: 0 0 50%;
      width: 50%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #ffffff;
      border-right: 1px solid #e5e5e5; /* Subtle book fold center seam line */
    }

    .page-portrait-frame:last-child {
      border-right: none;
    }

    /* Embedded PDF frame with requested Fit optimization parameters */
    .pdf-embedded-render {
      width: 100%;
      height: 100%;
      display: block;
      border: none;
      pointer-events: none; /* Allows double clicks to pass through onto parent canvas */
    }

    /* Overlay Interactive Arrow Navigation buttons */
    .navigation-arrow-overlays {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
      z-index: 200;
    }

    .nav-arrow-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      font-size: 24px;
      line-height: 40px;
      text-align: center;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.25s ease;
      user-select: none;
    }

    .nav-arrow-btn:hover:not(:disabled) {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .nav-arrow-btn:disabled {
      opacity: 0.15;
      cursor: not-allowed;
    }

    .double-click-hint {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.3);
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    /* ==========================================================================
       BOTTOM SITE FOOTER
       ========================================================================== */
    
    .site-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 50px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 40px;
      box-sizing: border-box;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.4);
      transition: opacity var(--transition-timing), transform var(--transition-timing);
    }

    .site-footer a {
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
    }

    /* ==========================================================================
       3. STAGE 2: IMMERSIVE FULL-SCREEN OVERRIDES
       ========================================================================== */
    
    /* When user double clicks canvas, parent container receives this focus class */
    .site-container.mode-immersive-focus .top-navbar {
      opacity: 0;
      transform: translateY(-70px);
      pointer-events: none;
    }

    .site-container.mode-immersive-focus .left-sidebar {
      opacity: 0;
      transform: translateX(-100px);
      pointer-events: none;
    }

    .site-container.mode-immersive-focus .site-footer {
      opacity: 0;
      transform: translateY(50px);
      pointer-events: none;
    }

    /* Immersive layer calibration rules: uses maximum screen workspace */
    .site-container.mode-immersive-focus .pdf-viewer-layer {
      width: 100vw;
      max-width: 100%;
      height: 100vh;
      aspect-ratio: auto;
