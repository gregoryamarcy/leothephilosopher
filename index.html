<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEO THE PHILOSOPHER | This Great Feast of Life</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .site-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            margin: 0 auto;
            background-image: url('index.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.2s ease-in-out;
        }
        
        /* Top Navigation Header Overlay */
        .nav-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8%;
            display: flex;
            z-index: 10;
        }
        .nav-logo {
            width: 16%;
            height: 100%;
            cursor: pointer;
        }
        .nav-spacer {
            width: 13%;
            height: 100%;
        }
        .nav-links {
            width: 71%;
            height: 100%;
            display: flex;
        }
        .nav-item {
            flex: 1;
            height: 100%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0);
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        /* Dynamic Left Sidebar Overlay for PROJECTS Tab */
        .sub-nav-overlay {
            position: absolute;
            top: 40%;
            left: 0;
            width: 16%;
            height: 20%;
            display: none;
            flex-direction: column;
            z-index: 10;
        }
        .sub-nav-item {
            width: 100%;
            height: 50%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0);
        }
        .sub-nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Razor-Sharp PDF Embed Viewport Container */
      .pdf-viewer-layer {
    position: absolute;
    top: 14%;
    left: 20%;
    width: 65%;
    height: 72vh;
    display: none;
    border: none;
    z-index: 5;
    background-color: #000000;
    /* --- ISOLATED CANVAS SANDBOX STYLES --- */
/* 1. Full Background Shield to cover projects.png text bleed */
#canvas-backdrop-sandbox {
    position: absolute;
    top: 8%;
    left: 22%;
    width: 84%;
    height: 92%;
    background-color: #000000;
    z-index: 4;
    display: none;
    border: none;
}

/* 2. Overwrite container overflow to lock out native scrollbars */
#pdfViewer {
    overflow: hidden;
    position: absolute;
    width: 65%;
    height: 72vh;
}

/* 3. The continuous horizontal layout strip */
#book-spread-track {
    display: flex;
    width: 200%; /* Spans 2 spreads total */
    height: 100%;
    transition: transform 0.4s ease-in-out; /* Smooth slide animation */
}

/* 4. Each single spread viewport box */
.book-spread {
    display: flex;
    width: 50%;
    height: 100%;
}

/* 5. Individual facing pages locked side-by-side */
.book-page {
    width: 50%;
    height: 100%;
    border: none;
    background-color: #000000;
    overflow: hidden;
}

/* Force modern browser PDF plugins to scale content to the element size */
@media screen and (min-width: 1px) {
    .book-page {
        height: 100%;
    }
}

}

/* Force modern browser PDF plugins to scale content to the element size */
@media screen and (min-width: 1px) {
    .book-page {
        height: 100%;
    }
}

}

/* Force modern browser PDF plugins to scale content to the element size */
@media screen and (min-width: 1px) {
    .book-page {
        height: 100%;
    }
}
     
    
    </style>
</head>
<body>

    <div class="site-container" id="slideViewer">
        <!-- Main Top Navigation -->
        <nav class="nav-overlay">
            <div class="nav-logo" onclick="jumpToTrack('index')"></div>
            <div class="nav-spacer"></div>
            <div class="nav-links">
                <div class="nav-item" onclick="jumpToTrack('projects')"></div>
                <div class="nav-item" onclick="jumpToTrack('about')"></div>
                <div class="nav-item" onclick="jumpToTrack('greg')"></div>
                <div class="nav-item" onclick="jumpToTrack('careers')"></div>
                <div class="nav-item" onclick="jumpToTrack('contact')"></div>
            </div>
        </nav>

        <!-- Dynamic Projects Left Panel Sub-Navigation -->
        <div class="sub-nav-overlay" id="projectsSubNav">
            <div class="sub-nav-item" onclick="jumpToTrack('wobblybook')"></div>
            <div class="sub-nav-item" onclick="jumpToTrack('synopsis')"></div>
        </div>
        <!-- Isolated Canvas Sandbox Backdrop Mask -->
        <div id="canvas-backdrop-sandbox"></div>

        <!-- Your Downsized Reading Canvas Layout Container with a Single Clean Frame -->
        <div id="pdfViewer" class="pdf-viewer-layer">
            <iframe src="synopsis.pdf#toolbar=0&navpanes=0&view=FitH" id="book-single-viewport" style="width: 100%; height: 100%; border: none;" scrolling="auto"></iframe>
        </div>

    <script>
        const bookTracks = {
            'index': { type: 'image', source: 'index.png' },
            'projects': { type: 'image', source: 'projects.png' },
            'about': { type: 'image', source: 'about.png' },
            'greg': { type: 'image', source: 'greg.png' },
            'careers': { type: 'image', source: 'careers.png' },
            'contact': { type: 'image', source: 'contact.png' },
            'wobblybook': { type: 'image', source: 'wobblybook.png' },
            
            // Explicitly handles your landscape stitched PDF document track
            'synopsis': { 
                type: 'document', 
                source: 'synopsis.pdf#toolbar=0&navpanes=0&view=FitH' 
            }
        };

        let currentTrack = 'index';
let currentSpreadIndex = 0;
const totalSpreads = 2;

        function jumpToTrack(trackName) {
            if (!bookTracks[trackName]) return;
            currentTrack = trackName;
            renderCurrentState();
        }

        function renderCurrentState() {
            const activeTrack = bookTracks[currentTrack];
            const slideViewer = document.getElementById('slideViewer');
            const pdfWindow = document.getElementById('pdfViewer');
    const sandboxMask = document.getElementById('canvas-backdrop-sandbox');
    const projectsMenu = document.getElementById('projectsSubNav');
            
            // 1. Handle Left Sub-Menu Visibility
            if (currentTrack === 'projects' || currentTrack === 'wobblybook' || currentTrack === 'synopsis') {
                projectsMenu.style.display = 'flex';
            } else {
                projectsMenu.style.display = 'none';
            }
            
            // 2. Route Content Types
            if (activeTrack.type === 'document') {
    slideViewer.style.backgroundImage = "url('projects.png')";
    if (sandboxMask) sandboxMask.style.display = "block";
    if (pdfWindow) pdfWindow.style.display = "block";
    lockVerticalScroll();
} else {
    slideViewer.style.backgroundImage = `url('${activeTrack.source}')`;
    if (sandboxMask) sandboxMask.style.display = "none";
    if (pdfWindow) pdfWindow.style.display = "none";
    resetBookTrack();
    unlockVerticalScroll();
}
// --- BOOK NAV ENGINE & ARROW BOUNDARIES ---
function navigateBook(direction) {
    const track = document.getElementById('book-spread-track');
    if (!track) return;

    if (direction === 'next' && currentSpreadIndex < totalSpreads - 1) {
        currentSpreadIndex++;
    } else if (direction === 'prev' && currentSpreadIndex > 0) {
        currentSpreadIndex--;
    }

    const translateAmount = currentSpreadIndex * -50;
    track.style.transform = `translateX(${translateAmount}%)`;
}

const leftBtn = document.getElementById('goSpreadLeft');
const rightBtn = document.getElementById('goSpreadRight');

function updateButtonStates() {
    if (!leftBtn || !rightBtn) return;
    leftBtn.disabled = (currentSpreadIndex === 0);
    rightBtn.disabled = (currentSpreadIndex === totalSpreads - 1);
    leftBtn.style.opacity = leftBtn.disabled ? "0.3" : "1.0";
    rightBtn.style.opacity = rightBtn.disabled ? "0.3" : "1.0";
}

if (leftBtn) leftBtn.addEventListener('click', () => { navigateBook('prev'); updateButtonStates(); });
if (rightBtn) rightBtn.addEventListener('click', () => { navigateBook('next'); updateButtonStates(); });
updateButtonStates(); // Initialize boundaries on load

// --- REVERSE TRACK BACK TO PAGE 1 ON CLOSE ---
function resetBookTrack() {
    currentSpreadIndex = 0;
    const track = document.getElementById('book-spread-track');
    if (track) track.style.transform = "translateX(0%)";
    updateButtonStates();
}

// --- VERTICAL WINDOW LEVEL SCROLL LOCKOUT ---
function preventDefaultScroll(e) { e.preventDefault(); }
const keysToBlock = { 32: 1, 33: 1, 34: 1, 35: 1, 36: 1, 38: 1, 40: 1 };
function preventKeyScroll(e) { if (keysToBlock[e.keyCode]) { e.preventDefault(); return false; } }

function lockVerticalScroll() {
    window.addEventListener('wheel', preventDefaultScroll, { passive: false });
    window.addEventListener('touchmove', preventDefaultScroll, { passive: false });
    window.addEventListener('keydown', preventKeyScroll, { passive: false });
}
function unlockVerticalScroll() {
    window.removeEventListener('wheel', preventDefaultScroll, { passive: false });
    window.removeEventListener('touchmove', preventDefaultScroll, { passive: false });
    window.removeEventListener('keydown', preventKeyScroll, { passive: false });
}

// --- KEYBOARD HORIZONTAL ARROW LISTENER ---
window.addEventListener('keydown', function(e) {
    const pdfWindow = document.getElementById('pdfViewer');
    if (pdfWindow && pdfWindow.style.display === "block") {
        if (e.keyCode === 37) { navigateBook('prev'); updateButtonStates(); }
        if (e.keyCode === 39) { navigateBook('next'); updateButtonStates(); }
    }
});

        }
    </script>
</body>
</html>
