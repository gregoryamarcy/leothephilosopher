<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEO THE PHILOSOPHER | This Great Feast of Life</title>
  <style>
    /* ==========================================================================
       GLOBAL SITE FRAMEWORK & RESPONSIVE TRACKING LAYOUT
       ========================================================================== */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden; /* Prevent native window scroll up/down */
    }

    .site-container {
      position: relative;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.5s ease-in-out;
    }

    /* ==========================================================================
       NAVIGATION & TRANSLUCENT OVERLAYS
       ========================================================================== */
    .nav-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 100;
    }

    .nav-logo {
      width: 150px;
      height: 40px;
      cursor: pointer;
    }

    .nav-spacer {
      flex-grow: 1;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-item {
      height: 30px;
      min-width: 60px;
      cursor: pointer;
    }

    .nav-sub-overlay {
      position: absolute;
      top: 60px;
      left: 20px;
      display: none; /* Controlled dynamically by JavaScript */
      flex-direction: column;
      gap: 10px;
      z-index: 90;
    }

    .sub-nav-item {
      height: 25px;
      width: 120px;
      cursor: pointer;
    }

    /* ==========================================================================
       SERIES SYNOPSIS COMPONENT CONTAINER LAYOUT
       ========================================================================== */
    .pdf-viewer-layer {
      display: none; /* Controlled dynamically by JavaScript */
      box-sizing: border-box;
      position: absolute;
      top: 7.5vh;
      
      /* Explicit wide dimensions to fit 16-page horizontal stitched layouts */
      width: 75vw;
      height: 85vh; 
      max-height: 85vh; 
      border: none;
      
      /* Exact Visual Balance Shifting 3/4" to the Right */
      transform: translateX(0.75in); 
      
      /* Smooth Transition State for Immersive Full-Screen Toggle */
      transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease, max-height 0.3s ease;
      z-index: 10;
    }

    /* ==========================================================================
       IMMERSIVE FULL-SCREEN / FOCUS MODE OVERRIDE
       ========================================================================== */
    .pdf-viewer-layer:fullscreen,
    .pdf-viewer-layer.focus-mode-active {
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      top: 0 !important;
      left: 0 !important;
      transform: translateX(0) !important;
      background-color: #000000 !important;
      z-index: 999999 !important;
    }
  </style>
</head>
<body>

  <div class="site-container" id="slideViewer">
    <!-- Main Top Navigation -->
    <nav class="nav-overlay">
      <div class="nav-logo" onclick="jumpToTrack('index')"></div>
      <div class="nav-spacer"></div>
      <div class="nav-links">
        <div class="nav-item" onclick="jumpToTrack('projects')"></div>
        <div class="nav-item" onclick="jumpToTrack('about')"></div>
        <div class="nav-item" onclick="jumpToTrack('greg')"></div>
        <div class="nav-item" onclick="jumpToTrack('careers')"></div>
        <div class="nav-item" onclick="jumpToTrack('contact')"></div>
      </div>
    </nav>

    <!-- Dynamic Projects Left Panel Sub-Navigation -->
    <div class="nav-sub-overlay" id="projectsSubNav">
      <div class="sub-nav-item" onclick="jumpToTrack('wobblybook')"></div>
      <div class="sub-nav-item" onclick="jumpToTrack('synopsis')"></div>
    </div>

    <!-- Interactive PDF Embed Viewport (Appears for Synopsis Track) -->
    <iframe class="pdf-viewer-layer" id="pdfViewer" src="about:blank"></iframe>
  </div>

  <script>
    const bookTracks = {
      'index': { type: 'image', source: 'index.png' },
      'projects': { type: 'image', source: 'projects.png' },
      'about': { type: 'image', source: 'about.png' },
      'greg': { type: 'image', source: 'greg.png' },
      'careers': { type: 'image', source: 'careers.png' },
      'contact': { type: 'image', source: 'contact.png' },
      'wobblybook': { type: 'image', source: 'wobblybook.png' },
      
      // Explicitly handles your landscape stitched PDF document track with clear Fit dimensions
      'synopsis': {
        type: 'document',
        source: 'synopsis.pdf#toolbar=0&navpanes=0&view=Fit'
      }
    };

    let currentTrack = 'index';

    function jumpToTrack(trackName) {
      if (!bookTracks[trackName]) return;
      currentTrack = trackName;
      renderCurrentState();
    }

    function renderCurrentState() {
      const activeTrack = bookTracks[currentTrack];
      const slideViewer = document.getElementById('slideViewer');
      const pdfWindow = document.getElementById('pdfViewer');
      const projectsMenu = document.getElementById('projectsSubNav');

      // 1. Handle Left Sub-Menu Visibility
      if (currentTrack === 'projects' || currentTrack === 'wobblybook' || currentTrack === 'synopsis') {
        projectsMenu.style.display = 'flex';
      } else {
        projectsMenu.style.display = 'none';
      }

      // 2. Route Content Types
      if (activeTrack.type === 'document') {
        // Pin background to projects layout frame so the menus stay visible
        slideViewer.style.backgroundImage = "url('projects.png')";
        
        // Activate the PDF canvas viewport smoothly
        pdfWindow.src = activeTrack.source;
        pdfWindow.style.display = 'block';
      } else {
        // Clear the document container and swap background image
        pdfWindow.style.display = 'none';
        pdfWindow.src = 'about:blank';
        slideViewer.style.backgroundImage = "url('" + activeTrack.source + "')";
      }
    }

    // Initialize the landing page view state on launch
    renderCurrentState();
  </script>
</body>
</html>
